name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.13
    with:
      # Package.swift requires Swift 6.3 (swift-tools-version: 6.3).
      linux_exclude_swift_versions: >-
        [{"swift_version": "5.9"}, {"swift_version": "5.10"}, {"swift_version": "6.0"},
         {"swift_version": "6.1"}, {"swift_version": "6.2"}]
      windows_exclude_swift_versions: >-
        [{"swift_version": "5.9"}, {"swift_version": "6.0"}, {"swift_version": "6.1"},
         {"swift_version": "6.2"}]
      macos_exclude_xcode_versions: >-
        [{"xcode_version": "16.4"}]
      enable_macos_checks: false
      enable_android_sdk_build: true
      enable_windows_checks: false
      enable_linux_checks: true
